<div class="users-header">
  <div class="users-title">
    <i class="material-icons title-icon">group</i>
    <h2 class="title-value">Usuarios</h2>
  </div>
  <div class="users-search-options">
    <app-search-filter (filter)="filterEvent($event)" [filterOptions]="filterOptions"></app-search-filter>
  </div>
</div>

<div class="users-list" role="list" #listContainer>
  <ng-container *ngFor="let user of users">
    <app-user-item (edit)="userSelected = $event" role="listitem" [user]="user"></app-user-item>
  </ng-container>
  <div #usersListBottom class="sentinel"></div>
</div>

<div class="users-footer">
  <button class="create-user" (click)="openCreateModal = true">Nuevo Usuario</button>
</div>



<app-user-create-modal
  *ngIf="openCreateModal"
  (close)="openCreateModal = false"
  (userCreated)="resetUserList()">
</app-user-create-modal>

<app-user-edit-modal
  *ngIf="userSelected"
  (close)="userSelected = undefined"
  [user]="userSelected!"
  (userEdited)="resetUserList()">
</app-user-edit-modal>
