<div class="user-item">

  <div class="user-info-primary">
    <div class="user-image">
      <i class="material-icons user-icon">person</i>
    </div>

    <div class="user-info">
      <h3 class="user-name">{{user.username}}</h3>
      <h4 class="user-email">{{'unimplemented@gmail.com'}}</h4>
    </div>
  </div>


  <div class="user-info-secondary">
    <div class="user-role">
      <h3 class="user-role-name">{{user.role.name}}</h3>
    </div>

    <div class="user-status">
      <h4 class="user-status-value" [ngClass]="user.active ? 'active' : 'inactive'">{{user.active? 'Activo' : 'Inactivo'}}</h4>
    </div>

    <button class="user-edit" (click)="edit.emit(user)">Editar</button>
  </div>



</div>
